box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;backdrop-filter:saturate(180%) blur(18px);background:rgba(244,250,246,.72);border-bottom:1px solid rgba(15,122,71,.1);font-size:14px}
nav b{font-weight:650;letter-spacing:-.01em}nav span{color:var(--mut)}
section{padding:18vh 6vw;text-align:center;position:relative}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(56px,13vw,160px);font-weight:700;letter-spacing:-.05em;line-height:.95}
h2{font-size:clamp(36px,7vw,84px);font-weight:700;letter-spacing:-.04em;line-height:1.03;max-width:16ch;margin:0 auto}
.lead{font-size:clamp(18px,2.2vw,26px);color:var(--mut);max-width:34ch;margin:28px auto 0;line-height:1.4;letter-spacing:-.01em}
.grad{background:linear-gradient(100deg,var(--g3),var(--g2) 60%,#8ee6b0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:14vh;overflow:hidden}
.hero .stage{position:relative;margin-top:5vh;width:min(46vh,70vw)}
.hero .stage::before{content:"";position:absolute;inset:-18% -40% -10%;background:radial-gradient(closest-side,rgba(47,191,113,.45),transparent 70%);filter:blur(10px);z-index:0}
.hero img{position:relative;z-index:1;width:100%;display:block;animation:float 6s ease-in-out infinite;filter:drop-shadow(0 40px 40px rgba(15,122,71,.28))}
@keyframes float{50%{transform:translateY(-14px)}}
.hero h1,.hero .lead{animation:in 1.1s cubic-bezier(.2,.7,.2,1) both}.hero .lead{animation-delay:.25s}.hero .stage{animation:in 1.3s .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(40px) scale(.97)}}
.dark{background:var(--dk);color:#fff}.dark .lead{color:#8fb5a2}.dark h2{color:#fff}
.dark .grad{background:linear-gradient(100deg,#7be0a4,#c9f7da);-webkit-background-clip:text;background-clip:text}
.rv{opacity:0;transform:translateY(46px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.on{opacity:1;transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;max-width:1100px;margin:9vh auto 0;text-align:left}
.card{background:#fff;border-radius:28px;padding:34px 30px;box-shadow:0 1px 0 rgba(15,122,71,.08),0 20px 50px -30px rgba(15,122,71,.35)}
.card.g{background:var(--g1)}
.card h3{font-size:22px;letter-spacing:-.02em;margin-bottom:10px}.card p{color:var(--mut);line-height:1.5;font-size:16px}
.big{font-size:clamp(48px,6vw,76px);font-weight:700;letter-spacing:-.045em;line-height:1;color:var(--g3)}
.big small{font-size:.38em;letter-spacing:-.01em;margin-left:4px}
.card .big+p{margin-top:12px;color:var(--ink);font-weight:550}
.split{display:grid;grid-template-columns:1fr 1fr;gap:6vw;align-items:center;max-width:1100px;margin:0 auto;text-align:left}
.split h2{margin:0;max-width:12ch}.split .lead{margin-left:0}
.pic{background:linear-gradient(160deg,#d3f2de,#9fe3bb);border-radius:40px;padding:6vh 4vw;display:grid;place-items:center;overflow:hidden}
.pic img{width:min(240px,60%);filter:drop-shadow(0 30px 30px rgba(6,35,26,.35))}
.bar{height:14px;border-radius:9px;background:rgba(255,255,255,.12);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--g2),var(--lt));transition:width 1.6s cubic-bezier(.2,.7,.2,1)}
.on .bar i{width:var(--w)}
.row{margin-top:26px;font-size:18px}.row span{color:#8fb5a2}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:7vh}
.chip{background:var(--g1);color:var(--g3);padding:12px 22px;border-radius:99px;font-size:17px;font-weight:600}
.dark .chip{background:rgba(123,224,164,.12);color:var(--lt)}
.price{font-size:clamp(70px,14vw,170px);font-weight:700;letter-spacing:-.055em;line-height:1;margin-top:30px}
.opts{display:inline-flex;background:var(--g1);border-radius:99px;padding:6px;margin-top:5vh;gap:4px}
.opts button{border:0;background:none;font:inherit;font-weight:600;font-size:17px;color:var(--g3);padding:13px 26px;border-radius:99px;cursor:pointer;transition:.3s}
.opts button.sel{background:var(--g3);color:#fff;box-shadow:0 8px 20px -8px var(--g3)}
.opts button:focus-visible,a:focus-visible{outline:3px solid var(--g2);outline-offset:3px}
.note{color:var(--mut);margin-top:18px;font-size:16px}
.ch{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:1000px;margin:9vh auto 0}
.ch .card{flex:1 1 280px;text-align:left;background:rgba(255,255,255,.06);box-shadow:none;border:1px solid rgba(123,224,164,.18)}
.ch .card p{color:#9dbfae}
.foot{padding:12vh 6vw 10vh;text-align:center;color:var(--mut);font-size:15px}
.foot h2{margin-bottom:22px}
@media(max-width:760px){.split{grid-template-columns:1fr;text-align:center}.split h2,.split .lead{margin-left:auto;margin-right:auto}section{padding:14vh 6vw}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

.tbl{width:100%;min-width:560px;max-width:900px;margin:8vh auto 0;border-collapse:collapse;text-align:left;font-size:16px}
.tbl th,.tbl td{padding:16px 14px;border-bottom:1px solid rgba(15,122,71,.15)}.tbl th{color:var(--g3);font-weight:650}
.tbl td:not(:first-child),.tbl th:not(:first-child){text-align:center}.y{color:var(--g3);font-weight:700}.n{color:#7d9488}
.stack{display:flex;height:60px;border-radius:20px;overflow:hidden;max-width:1000px;margin:6vh auto 0;gap:3px}
.stack i{width:0;transition:width 1.6s cubic-bezier(.2,.7,.2,1)}.stack.on i{width:var(--w)}
.flow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:1100px;margin:8vh auto 0}
